<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人中心界面设计图</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, sans-serif; background: #f0f2f5; padding: 20px; }
  .title { text-align: center; font-size: 16px; margin-bottom: 20px; color: #333; }
  .mockup { max-width: 1000px; margin: 0 auto; border: 2px solid #333; background: #fff; overflow: hidden; }
  .nav { display: flex; align-items: center; height: 56px; padding: 0 24px; background: #fff; border-bottom: 1px solid #e5e6eb; gap: 24px; }
  .nav-logo { font-size: 16px; font-weight: bold; }
  .nav-menu { display: flex; gap: 20px; font-size: 14px; color: #666; }
  .nav-menu span { cursor: pointer; }
  .nav-search { flex: 1; max-width: 200px; }
  .nav-search input { width: 100%; border: 1px solid #e5e6eb; border-radius: 20px; padding: 6px 14px; font-size: 13px; outline: none; }
  .nav-icons { display: flex; gap: 16px; font-size: 18px; color: #666; }
  .user-card { background: linear-gradient(135deg, #165DFF, #4080FF); padding: 32px 24px; color: #fff; display: flex; gap: 20px; align-items: center; }
  .avatar { width: 80px; height: 80px; border-radius: 50%; background: rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; font-size: 36px; position: relative; }
  .avatar .cam { position: absolute; bottom: -2px; right: -2px; width: 24px; height: 24px; background: #fff; border-radius: 50%; font-size: 14px; display: flex; align-items: center; justify-content: center; color: #165DFF; }
  .user-info h2 { font-size: 22px; margin-bottom: 8px; }
  .tags { display: flex; gap: 8px; margin-bottom: 16px; }
  .tag { background: rgba(255,255,255,0.25); padding: 2px 12px; border-radius: 12px; font-size: 12px; }
  .stats { display: flex; gap: 32px; }
  .stat { text-align: center; }
  .stat-num { font-size: 22px; font-weight: bold; }
  .stat-label { font-size: 12px; opacity: 0.8; }
  .quick-actions { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; padding: 24px; }
  .action-card { border: 1px solid #e5e6eb; border-radius: 8px; padding: 20px 12px; text-align: center; cursor: pointer; transition: all 0.2s; }
  .action-card:hover { border-color: #165DFF; transform: translateY(-2px); }
  .action-icon { font-size: 28px; margin-bottom: 8px; }
  .action-name { font-size: 13px; color: #333; }
  .info-section { padding: 24px; border-top: 1px solid #e5e6eb; }
  .info-section h3 { font-size: 16px; margin-bottom: 16px; color: #333; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 12px; }
  .form-field { display: flex; flex-direction: column; gap: 4px; }
  .form-field label { font-size: 13px; color: #666; }
  .form-field input, .form-field textarea { border: 1px solid #e5e6eb; border-radius: 6px; padding: 8px 12px; font-size: 14px; outline: none; }
  .form-field textarea { height: 60px; resize: none; }
  .form-field input:disabled { background: #f5f5f5; color: #999; }
  .btn-row { display: flex; gap: 12px; margin-top: 16px; }
  .btn { padding: 8px 24px; border-radius: 6px; border: none; font-size: 14px; cursor: pointer; }
  .btn-primary { background: #165DFF; color: #fff; }
  .btn-default { background: #fff; border: 1px solid #e5e6eb; color: #666; }
  .security-section { padding: 24px; border-top: 1px solid #e5e6eb; }
  .security-section h3 { font-size: 16px; margin-bottom: 16px; color: #333; }
  .security-item { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid #f0f0f0; }
  .security-item:last-child { border-bottom: none; }
  .sec-left { display: flex; gap: 12px; align-items: center; }
  .sec-icon { font-size: 20px; }
  .sec-info h4 { font-size: 14px; color: #333; margin-bottom: 4px; }
  .sec-info p { font-size: 12px; color: #888; }
  .sec-link { font-size: 13px; color: #165DFF; cursor: pointer; }
</style>
</head>
<body>
<div class="title">个人中心界面设计图（图4.10）</div>
<div class="mockup">
<div class="nav">
<div class="nav-logo">🎓 CampusTrade</div>
<div class="nav-menu"><span>首页</span><span>商品</span><span>圈子</span><span>AI助手</span></div>
<div class="nav-search"><input type="text" placeholder="🔍 搜索商品"></div>
<div class="nav-icons"><span>🛒</span><span>🔔</span><span></span></div>
</div>
<div class="user-card">
<div class="avatar">👤<div class="cam">📷</div></div>
<div class="user-info">
<h2>张同学</h2>
<div class="tags"><span class="tag">🛍️ 买家</span><span class="tag"> 卖家</span></div>
<div class="stats">
<div class="stat"><div class="stat-num">12</div><div class="stat-label">订单数</div></div>
<div class="stat"><div class="stat-num">5</div><div class="stat-label">商品数</div></div>
<div class="stat"><div class="stat-num">23</div><div class="stat-label">收藏数</div></div>
<div class="stat"><div class="stat-num">45</div><div class="stat-label">加入天数</div></div>
</div>
</div>
</div>
<div class="quick-actions">
<div class="action-card"><div class="action-icon">📄</div><div class="action-name">我的订单</div></div>
<div class="action-card"><div class="action-icon">⭐</div><div class="action-name">我的收藏</div></div>
<div class="action-card"><div class="action-icon"></div><div class="action-name">我的商品</div></div>
<div class="action-card"><div class="action-icon">➕</div><div class="action-name">发布商品</div></div>
<div class="action-card"><div class="action-icon">📍</div><div class="action-name">收货地址</div></div>
</div>
<div class="info-section">
<h3>基本信息</h3>
<div class="form-row">
<div class="form-field"><label>用户名</label><input type="text" value="zhangsan" disabled></div>
<div class="form-field"><label>昵称</label><input type="text" value="张同学"></div>
</div>
<div class="form-row">
<div class="form-field"><label>手机号码</label><input type="text" value="13812345678"></div>
<div class="form-field"><label>邮箱地址</label><input type="text" value="zhang@university.edu.cn"></div>
</div>
<div class="form-field"><label>个人简介</label><textarea placeholder="介绍一下自己吧..."></textarea></div>
<div class="btn-row"><button class="btn btn-primary">保存修改</button><button class="btn btn-default">重置</button></div>
</div>
<div class="security-section">
<h3>安全设置</h3>
<div class="security-item">
<div class="sec-left"><span class="sec-icon">🔒</span><div class="sec-info"><h4>修改密码</h4><p>定期更换密码可以保护账号安全</p></div></div>
<span class="sec-link">修改 →</span>
</div>
<div class="security-item">
<div class="sec-left"><span class="sec-icon">📱</span><div class="sec-info"><h4>手机绑定</h4><p>已绑定: 138****5678</p></div></div>
<span class="sec-link">更换 →</span>
</div>
</div>
</div>
</div>
</body>
</html>
