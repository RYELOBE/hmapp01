<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="850" xmlns="http://www.w3.org/2000/svg" style="background:#fff; font-family: -apple-system, sans-serif;">
  <text x="500" y="30" text-anchor="middle" font-size="16" fill="#333">个人中心界面设计图（图4.10）</text>
  
  <!-- Mockup border -->
  <rect x="20" y="50" width="960" height="770" rx="4" fill="#fff" stroke="#333" stroke-width="2"/>
  
  <!-- Navigation -->
  <rect x="20" y="50" width="960" height="50" rx="4" fill="#fff"/>
  <line x1="20" y1="100" x2="980" y2="100" stroke="#e5e6eb" stroke-width="1"/>
  <text x="50" y="82" font-size="15" font-weight="bold"> CampusTrade</text>
  <text x="200" y="82" font-size="14" fill="#666">首页</text>
  <text x="250" y="82" font-size="14" fill="#666">商品</text>
  <text x="300" y="82" font-size="14" fill="#666">圈子</text>
  <text x="350" y="82" font-size="14" fill="#666">AI助手</text>
  <rect x="500" y="66" width="180" height="28" rx="14" fill="#f5f5f5" stroke="#e5e6eb"/>
  <text x="520" y="85" font-size="12" fill="#999">🔍 搜索商品</text>
  <text x="760" y="82" font-size="16">🛒</text>
  <text x="790" y="82" font-size="16"></text>
  <text x="820" y="82" font-size="16"></text>
  
  <!-- User Info Card (blue gradient) -->
  <defs><linearGradient id="userGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#165DFF"/><stop offset="100%" style="stop-color:#4080FF"/></linearGradient></defs>
  <rect x="22" y="102" width="956" height="180" rx="2" fill="url(#userGrad)"/>
  
  <!-- Avatar -->
  <circle cx="100" cy="180" r="40" fill="rgba(255,255,255,0.3)"/>
  <text x="100" y="190" text-anchor="middle" font-size="32" fill="#fff">👤</text>
  <circle cx="130" cy="210" r="12" fill="#fff"/>
  <text x="130" y="215" text-anchor="middle" font-size="12" fill="#165DFF">📷</text>
  
  <!-- User Info -->
  <text x="170" y="175" font-size="20" fill="#fff" font-weight="bold">张同学</text>
  <rect x="170" y="185" width="50" height="20" rx="10" fill="rgba(255,255,255,0.25)"/>
  <text x="195" y="199" text-anchor="middle" font-size="11" fill="#fff">🛍️ 买家</text>
  <rect x="228" y="185" width="50" height="20" rx="10" fill="rgba(255,255,255,0.25)"/>
  <text x="253" y="199" text-anchor="middle" font-size="11" fill="#fff"> 卖家</text>
  
  <!-- Stats -->
  <text x="170" y="250" font-size="20" fill="#fff" font-weight="bold">12</text>
  <text x="170" y="268" font-size="11" fill="#fff" opacity="0.8">订单数</text>
  
  <text x="290" y="250" font-size="20" fill="#fff" font-weight="bold">5</text>
  <text x="290" y="268" font-size="11" fill="#fff" opacity="0.8">商品数</text>
  
  <text x="410" y="250" font-size="20" fill="#fff" font-weight="bold">23</text>
  <text x="410" y="268" font-size="11" fill="#fff" opacity="0.8">收藏数</text>
  
  <text x="530" y="250" font-size="20" fill="#fff" font-weight="bold">45</text>
  <text x="530" y="268" font-size="11" fill="#fff" opacity="0.8">加入天数</text>
  
  <!-- Quick Actions -->
  <rect x="50" y="310" width="160" height="70" rx="6" fill="#fff" stroke="#e5e6eb"/>
  <text x="130" y="340" text-anchor="middle" font-size="24">📄</text>
  <text x="130" y="365" text-anchor="middle" font-size="13" fill="#333">我的订单</text>
  
  <rect x="225" y="310" width="160" height="70" rx="6" fill="#fff" stroke="#e5e6eb"/>
  <text x="305" y="340" text-anchor="middle" font-size="24">⭐</text>
  <text x="305" y="365" text-anchor="middle" font-size="13" fill="#333">我的收藏</text>
  
  <rect x="400" y="310" width="160" height="70" rx="6" fill="#fff" stroke="#e5e6eb"/>
  <text x="480" y="340" text-anchor="middle" font-size="24"></text>
  <text x="480" y="365" text-anchor="middle" font-size="13" fill="#333">我的商品</text>
  
  <rect x="575" y="310" width="160" height="70" rx="6" fill="#fff" stroke="#e5e6eb"/>
  <text x="655" y="340" text-anchor="middle" font-size="24">➕</text>
  <text x="655" y="365" text-anchor="middle" font-size="13" fill="#333">发布商品</text>
  
  <rect x="750" y="310" width="160" height="70" rx="6" fill="#fff" stroke="#e5e6eb"/>
  <text x="830" y="340" text-anchor="middle" font-size="24">📍</text>
  <text x="830" y="365" text-anchor="middle" font-size="13" fill="#333">收货地址</text>
  
  <!-- Basic Info Section -->
  <line x1="50" y1="400" x2="930" y2="400" stroke="#e5e6eb"/>
  <text x="50" y="430" font-size="15" font-weight="bold" fill="#333">基本信息</text>
  
  <text x="50" y="465" font-size="12" fill="#666">用户名</text>
  <rect x="50" y="475" width="380" height="34" rx="4" fill="#f5f5f5" stroke="#e5e6eb"/>
  <text x="65" y="497" font-size="13" fill="#999">zhangsan</text>
  
  <text x="460" y="465" font-size="12" fill="#666">昵称</text>
  <rect x="460" y="475" width="380" height="34" rx="4" fill="#fff" stroke="#e5e6eb"/>
  <text x="475" y="497" font-size="13" fill="#333">张同学</text>
  
  <text x="50" y="535" font-size="12" fill="#666">手机号码</text>
  <rect x="50" y="545" width="380" height="34" rx="4" fill="#fff" stroke="#e5e6eb"/>
  <text x="65" y="567" font-size="13" fill="#333">13812345678</text>
  
  <text x="460" y="535" font-size="12" fill="#666">邮箱地址</text>
  <rect x="460" y="545" width="380" height="34" rx="4" fill="#fff" stroke="#e5e6eb"/>
  <text x="475" y="567" font-size="13" fill="#333">zhang@university.edu.cn</text>
  
  <text x="50" y="605" font-size="12" fill="#666">个人简介</text>
  <rect x="50" y="615" width="790" height="60" rx="4" fill="#fff" stroke="#e5e6eb"/>
  <text x="65" y="645" font-size="13" fill="#999">介绍一下自己吧...</text>
  
  <rect x="50" y="690" width="80" height="32" rx="4" fill="#165DFF"/>
  <text x="90" y="712" text-anchor="middle" font-size="13" fill="#fff">保存修改</text>
  <rect x="140" y="690" width="60" height="32" rx="4" fill="#fff" stroke="#e5e6eb"/>
  <text x="170" y="712" text-anchor="middle" font-size="13" fill="#666">重置</text>
  
  <!-- Security Section -->
  <line x1="50" y1="740" x2="930" y2="740" stroke="#e5e6eb"/>
  <text x="50" y="770" font-size="15" font-weight="bold" fill="#333">安全设置</text>
  
  <line x1="50" y1="790" x2="930" y2="790" stroke="#f0f0f0"/>
  <text x="50" y="808" font-size="14">🔒</text>
  <text x="80" y="808" font-size="13" fill="#333" font-weight="bold">修改密码</text>
  <text x="80" y="825" font-size="11" fill="#888">定期更换密码可以保护账号安全</text>
  <text x="900" y="810" font-size="12" fill="#165DFF">修改 →</text>
  
  <text x="50" y="858" font-size="14">📱</text>
  <text x="80" y="858" font-size="13" fill="#333" font-weight="bold">手机绑定</text>
  <text x="80" y="875" font-size="11" fill="#888">已绑定: 138****5678</text>
  <text x="900" y="860" font-size="12" fill="#165DFF">更换 →</text>
</svg>
