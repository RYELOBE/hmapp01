<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="700" xmlns="http://www.w3.org/2000/svg" style="background:#fff; font-family: -apple-system, sans-serif;">
  <text x="600" y="30" text-anchor="middle" font-size="16" fill="#333">登录/注册界面设计图（图4.8）</text>
  
  <!-- Login Page -->
  <rect x="30" y="60" width="540" height="300" rx="4" fill="#fff" stroke="#333" stroke-width="2"/>
  <!-- Left Panel -->
  <rect x="30" y="60" width="270" height="300" rx="4" fill="url(#loginGrad)"/>
  <defs><linearGradient id="loginGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#165DFF"/><stop offset="100%" style="stop-color:#69C0FF"/></linearGradient></defs>
  <!-- SVG placeholder -->
  <rect x="120" y="120" width="80" height="60" rx="4" fill="#fff" opacity="0.3"/>
  <rect x="140" y="100" width="40" height="25" rx="3" fill="#fff" opacity="0.5"/>
  <circle cx="130" cy="155" r="6" fill="#FFD666"/>
  <circle cx="190" cy="150" r="5" fill="#73D13D"/>
  <text x="165" y="210" text-anchor="middle" font-size="18" fill="#fff">校园二手交易平台</text>
  <text x="165" y="235" text-anchor="middle" font-size="13" fill="#fff" opacity="0.9">闲置不浪费，校园淘好物</text>
  
  <!-- Right Panel -->
  <text x="320" y="95" font-size="16" font-weight="bold" fill="#333"> CampusTrade</text>
  <text x="320" y="125" font-size="18" font-weight="bold" fill="#333">普通师生登陆</text>
  <text x="320" y="145" font-size="12" fill="#888">请输入您的账号信息</text>
  
  <!-- Input fields -->
  <rect x="320" y="160" width="230" height="40" rx="6" fill="#f5f5f5" stroke="#ddd"/>
  <text x="340" y="185" font-size="13" fill="#999">👤 用户名 / 手机号 / 邮箱</text>
  
  <rect x="320" y="210" width="230" height="40" rx="6" fill="#f5f5f5" stroke="#ddd"/>
  <text x="340" y="235" font-size="13" fill="#999"> 密码</text>
  
  <text x="320" y="275" font-size="12" fill="#888">☐ 记住我</text>
  <text x="480" y="275" font-size="12" fill="#165DFF">忘记密码?</text>
  
  <rect x="320" y="288" width="230" height="38" rx="6" fill="#165DFF"/>
  <text x="435" y="312" text-anchor="middle" font-size="14" fill="#fff">登  录</text>
  
  <text x="435" y="345" text-anchor="middle" font-size="12" fill="#888">还没有账号？ <tspan fill="#165DFF">立即注册</tspan></text>
  
  <!-- Register Page -->
  <rect x="630" y="60" width="540" height="300" rx="4" fill="#fff" stroke="#333" stroke-width="2"/>
  <!-- Left Panel -->
  <rect x="630" y="60" width="270" height="300" rx="4" fill="url(#loginGrad)"/>
  <rect x="720" y="120" width="80" height="60" rx="4" fill="#fff" opacity="0.3"/>
  <rect x="740" y="100" width="40" height="25" rx="3" fill="#fff" opacity="0.5"/>
  <circle cx="730" cy="155" r="6" fill="#FFD666"/>
  <circle cx="790" cy="150" r="5" fill="#73D13D"/>
  <text x="765" y="210" text-anchor="middle" font-size="18" fill="#fff">校园二手交易平台</text>
  <text x="765" y="235" text-anchor="middle" font-size="13" fill="#fff" opacity="0.9">闲置不浪费，校园淘好物</text>
  
  <!-- Right Panel -->
  <text x="920" y="95" font-size="16" font-weight="bold" fill="#333">🎓 CampusTrade</text>
  <text x="920" y="125" font-size="18" font-weight="bold" fill="#333">创建新账号</text>
  <text x="920" y="145" font-size="12" fill="#888">加入校园二手交易平台</text>
  
  <rect x="920" y="160" width="230" height="32" rx="6" fill="#f5f5f5" stroke="#ddd"/>
  <text x="940" y="181" font-size="12" fill="#999">用户名（用于登录）</text>
  
  <rect x="920" y="198" width="230" height="32" rx="6" fill="#f5f5f5" stroke="#ddd"/>
  <text x="940" y="219" font-size="12" fill="#999">📱 手机号</text>
  
  <rect x="920" y="236" width="230" height="32" rx="6" fill="#f5f5f5" stroke="#ddd"/>
  <text x="940" y="257" font-size="12" fill="#999">🔒 密码（至少6位）</text>
  
  <rect x="920" y="274" width="230" height="32" rx="6" fill="#f5f5f5" stroke="#ddd"/>
  <text x="940" y="295" font-size="12" fill="#999">🔒 确认密码</text>
  
  <!-- Role cards -->
  <rect x="920" y="320" width="108" height="55" rx="6" fill="#fff" stroke="#165DFF" stroke-width="2"/>
  <circle cx="1018" cy="325" r="8" fill="#165DFF"/>
  <text x="1018" y="328" text-anchor="middle" font-size="10" fill="#fff">✓</text>
  <text x="974" y="342" text-anchor="middle" font-size="20">🛍️</text>
  <text x="974" y="356" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">我是买家</text>
  <text x="974" y="370" text-anchor="middle" font-size="9" fill="#888">淘好物 省钱省心</text>
  
  <rect x="1036" y="320" width="108" height="55" rx="6" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="1090" y="342" text-anchor="middle" font-size="20">💰</text>
  <text x="1090" y="356" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">我是卖家</text>
  <text x="1090" y="370" text-anchor="middle" font-size="9" fill="#888">卖闲置 回收资金</text>
  
  <text x="920" y="395" font-size="11" fill="#333"><tspan fill="red">*</tspan> 选择身份（可多选）</text>
  <text x="920" y="412" font-size="10" fill="#888">☐ 我已阅读并同意 <tspan fill="#165DFF">《用户协议》</tspan> 和 <tspan fill="#165DFF">《隐私政策》</tspan></text>
  
  <rect x="920" y="425" width="230" height="34" rx="6" fill="#FF7D00"/>
  <text x="1035" y="447" text-anchor="middle" font-size="13" fill="#fff">注  册</text>
  
  <text x="1035" y="478" text-anchor="middle" font-size="11" fill="#888">已有账号？ <tspan fill="#165DFF">返回登录</tspan></text>
</svg>
